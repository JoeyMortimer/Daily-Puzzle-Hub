name: Refresh puzzle answers
on:
  workflow_dispatch:
  schedule:
    - cron: '40 5 * * *'
      timezone: Europe/London
    - cron: '20 6 * * *'
      timezone: Europe/London
    - cron: '50 6 * * *'
      timezone: Europe/London
    - cron: '10 8 * * *'
      timezone: Europe/London
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Fetch today's verified answers
        run: python scripts/update.py --force
      - name: Validate puzzle structures
        run: python scripts/validate.py
      - name: Embed latest edition
        run: python scripts/embed.py
      - name: Save new data
        run: |
          git config user.name "daily-puzzle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh puzzle solutions"
            git push
          fi
